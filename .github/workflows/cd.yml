# ─────────────────────────────────────────────────────────────────────────────
# CD Workflow – publishes container images to GHCR after merge to master
# Images are only published from the master branch (trusted code)
# ─────────────────────────────────────────────────────────────────────────────

name: CD – Publish Image

on:
  push:
    branches: ["master"]   # Only runs after a PR is merged into master

# Permissions needed to publish to GHCR and read repo contents
permissions:
  contents: read
  packages: write          # Allows pushing to ghcr.io

jobs:
  publish:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry using the automatically-provided token
      # We never store passwords – GITHUB_TOKEN is ephemeral and scoped to this run
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for image tags and labels
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/service-status-dashboard
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # Build and push the image
      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published image tags
        run: |
          echo "✅ Image published:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "To pull the image:"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/service-status-dashboard:latest"
