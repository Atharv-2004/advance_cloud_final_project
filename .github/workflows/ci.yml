# ─────────────────────────────────────────────────────────────────────────────
# CI Workflow – runs on every push and pull request
# Purpose: verify tests, lint, Docker build, and Kubernetes manifests pass
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["master", "devops-demo"]
  pull_request:
    branches: ["master"]

# Minimal permissions – principle of least privilege
permissions:
  contents: read

jobs:
  # ── 1. Run automated tests ──────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── 2. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run lint
        run: npm run lint

  # ── 3. Docker image build validation ────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: service-status-dashboard:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Kubernetes manifest validation ───────────────────────────────────────
  k8s-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ubuntu-latest ships with kubectl – no extra install action needed.
      # Use kubectl config subcommands to build a minimal fake kubeconfig so
      # --dry-run=client can resolve API groups without a real cluster.
      # (A heredoc inside a YAML file embeds leading spaces and corrupts the
      #  kubeconfig; kubectl config set-* writes a clean file instead.)
      - name: Set up minimal kubeconfig for client-side validation
        run: |
          kubectl config set-cluster fake --server=https://127.0.0.1:6443 --insecure-skip-tls-verify=true
          kubectl config set-credentials fake --token=fake-token
          kubectl config set-context fake --cluster=fake --user=fake
          kubectl config use-context fake
          kubectl version --client

      - name: Validate manifests with kubectl dry-run
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/configmap.yaml
          kubectl apply --dry-run=client -f k8s/secret.yaml
          kubectl apply --dry-run=client -f k8s/deployment.yaml
          kubectl apply --dry-run=client -f k8s/service.yaml

