# ConfigMap – stores non-secret configuration as key-value pairs
# Environment variables are injected into the Pod from here
# ConfigMaps separate config from code (12-factor app principle)
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssd-config
  namespace: ssd
  labels:
    app: service-status-dashboard
data:
  SERVICE_NAME: "Service Status Dashboard"
  SERVICE_VERSION: "1.0.0"
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
