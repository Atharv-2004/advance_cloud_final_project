# Secret – stores sensitive values (base64 encoded, NOT encrypted)
#
# IMPORTANT: base64 is encoding, NOT encryption.
# Anyone with kubectl access can decode this:
#   echo "c29tZS1zZWNyZXQ=" | base64 --decode
#
# In production, use:
#   - Kubernetes External Secrets Operator
#   - HashiCorp Vault
#   - Cloud provider secret managers (AWS Secrets Manager, GCP Secret Manager)
#
# This Secret is a placeholder – our app does not require authentication.
# It demonstrates how secrets are structured in Kubernetes.
apiVersion: v1
kind: Secret
metadata:
  name: ssd-secret
  namespace: ssd
  labels:
    app: service-status-dashboard
type: Opaque
data:
  # "placeholder" base64 encoded: echo -n "placeholder" | base64
  APP_SECRET_KEY: "cGxhY2Vob2xkZXI="
