# Prometheus configuration
# This file tells Prometheus what to scrape and how often
global:
  scrape_interval: 15s       # How often to collect metrics
  evaluation_interval: 15s   # How often to evaluate alert rules

# Alert rules file location
rule_files:
  - "alert_rules.yml"

# Scrape configs define WHAT to collect metrics from
scrape_configs:
  # Prometheus scrapes itself (so you can monitor Prometheus)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Our Service Status Dashboard
  # When running in kind, use the port-forwarded address
  - job_name: "service-status-dashboard"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # If running in Kubernetes (with port-forward active):
  # - job_name: "service-status-dashboard-k8s"
  #   static_configs:
  #     - targets: ["localhost:8080"]   # kubectl port-forward port
